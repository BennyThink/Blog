name: tudou-emdash
services:
  emdash:
    image: ghcr.io/bennythink/blog:latest
    ports:
      - "127.0.0.1:${EMDASH_PORT:-4321}:4321"
    environment:
      EMDASH_SITE_URL: ${EMDASH_SITE_URL:-http://localhost:4321}
      EMDASH_ENCRYPTION_KEY: ${EMDASH_ENCRYPTION_KEY:?Generate .env with npm run secrets:init first}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      COMMENT_BLOCKED_IPS: ${COMMENT_BLOCKED_IPS:-}
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:4321/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
