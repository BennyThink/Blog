services:
  emdash:
    build:
      context: .
      args:
        EMDASH_SITE_URL: ${EMDASH_SITE_URL:-http://localhost:4321}
    ports:
      - "127.0.0.1:4321:4321"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:4321/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5



  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
      MP_SMTP_REQUIRE_STARTTLS: "true"
