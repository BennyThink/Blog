name: tudou-emdash
services:
  emdash:
    image: ghcr.io/bennythink/blog:latest
    ports:
      - "127.0.0.1:4321:4321"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:4321/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
