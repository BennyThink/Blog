version: '3.1'

services:
  benny:
    image: wordpress:php8.5-apache
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: benny
    volumes:
      - ./www/dmesg.app/:/var/www/html
    ports:
      - "127.0.0.1:10000:80"
