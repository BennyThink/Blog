version: '3.1'

services:
  db:
    image: mysql:8
    restart: always
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "127.0.0.1:3306:3306"
      - "192.168.6.1:3306:3306"
      - "172.17.0.1:3306:3306"
    command: "--skip-log-bin"

  benny:
    image: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: benny
    volumes:
      - ./www/dmesg.app/:/var/www/html

  aurelia:
    image: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: aurelia
    volumes:
      - ./www/aurelia.im/:/var/www/html

  webp:
    image: webpsh/webps
    restart: always
    volumes:
      - ./webp_cache/:/opt/exhaust
      - ./www/dmesg.app/:/opt/pics

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./conf:/etc/nginx/conf.d
      - ./logs:/var/log/nginx/
      - ./certs/:/etc/nginx/certs/
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Shanghai
