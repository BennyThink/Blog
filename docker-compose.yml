version: '3.1'

services:
  db:
    image: ubuntu/mysql:8.0-22.04_beta
    restart: always
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "127.0.0.1:3306:3306"
      - "172.17.0.1:3306:3306" # for ytdlbot
      - "192.168.6.1:3306:3306"
    command: "--skip-log-bin"

  benny:
    image: wordpress:php8.5-apache
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: benny
    volumes:
      - ./www/dmesg.app/:/var/www/html
    ports:
      - "127.0.0.1:10000:80"
  pages:
    image: pages
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [ "python", "server.py","-h=0.0.0.0" ]
    ports:
      - "127.0.0.1:20080:20080"
